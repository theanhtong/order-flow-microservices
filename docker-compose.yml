services:
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: db_auth
    ports:
      - "5435:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d db_auth"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: auth-service
    container_name: auth-service
    restart: always
    ports:
      - "${AUTH_SERVICE_PORT:-3004}:3004"
    environment:
      NODE_ENV: production
      AUTH_SERVICE_PORT: 3004
      DATABASE_URL: "postgres://${DB_USERNAME:-postgres}:${DB_PASSWORD:-postgres}@auth-db:5432/db_auth"
      DB_SYNCHRONIZE: "true"
      JWT_SECRET: "${JWT_SECRET:-super_secret_jwt_key_2026}"
    depends_on:
      auth-db:
        condition: service_healthy

  order-db:
    image: postgres:16-alpine
    container_name: order-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-db_order}
    ports:
      - "5432:5432"
    volumes:
      - order_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-db_order}"]
      interval: 5s
      timeout: 5s
      retries: 5

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: order-service
    container_name: order-service
    restart: always
    ports:
      - "${ORDER_SERVICE_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      ORDER_SERVICE_PORT: 3001
      DATABASE_URL: "postgres://${DB_USERNAME:-postgres}:${DB_PASSWORD:-postgres}@order-db:5432/${DB_NAME:-db_order}"
      DB_SYNCHRONIZE: "true"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672"
    depends_on:
      order-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  inventory-db:
    image: postgres:16-alpine
    container_name: inventory-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: db_inventory
    ports:
      - "5433:5432"
    volumes:
      - inventory_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d db_inventory"]
      interval: 5s
      timeout: 5s
      retries: 5

  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: inventory-service
    container_name: inventory-service
    restart: always
    ports:
      - "${INVENTORY_SERVICE_PORT:-3002}:3002"
    environment:
      NODE_ENV: production
      INVENTORY_SERVICE_PORT: 3002
      DATABASE_URL: "postgres://${DB_USERNAME:-postgres}:${DB_PASSWORD:-postgres}@inventory-db:5432/db_inventory"
      DB_SYNCHRONIZE: "true"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672"
    depends_on:
      inventory-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  product-db:
    image: postgres:16-alpine
    container_name: product-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: db_product
    ports:
      - "5434:5432"
    volumes:
      - product_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d db_product"]
      interval: 5s
      timeout: 5s
      retries: 5

  product-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: product-service
    container_name: product-service
    restart: always
    ports:
      - "${PRODUCT_SERVICE_PORT:-3003}:3003"
    environment:
      NODE_ENV: production
      PRODUCT_SERVICE_PORT: 3003
      DATABASE_URL: "postgres://${DB_USERNAME:-postgres}:${DB_PASSWORD:-postgres}@product-db:5432/db_product"
      DB_SYNCHRONIZE: "true"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672"
    depends_on:
      product-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: api-gateway
    container_name: api-gateway
    restart: always
    ports:
      - "${API_GATEWAY_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      API_GATEWAY_PORT: 3000
      AUTH_SERVICE_URL: "http://auth-service:3004"
      ORDER_SERVICE_URL: "http://order-service:3001"
      INVENTORY_SERVICE_URL: "http://inventory-service:3002"
      PRODUCT_SERVICE_URL: "http://product-service:3003"
      JWT_SECRET: "${JWT_SECRET:-super_secret_jwt_key_2026}"
    depends_on:
      - auth-service
      - order-service
      - inventory-service
      - product-service

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: notification-service
    container_name: notification-service
    restart: always
    environment:
      NODE_ENV: production
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672"
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  auth_db_data:
  order_db_data:
  inventory_db_data:
  product_db_data:
